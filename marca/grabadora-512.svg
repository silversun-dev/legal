<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2330"/><stop offset="1" stop-color="#4a2a12"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/><stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#cielo)"/>
  <g id="motivo">

    <!-- Micrófono: cápsula, horquilla, pie. Grabar es el gesto de la app. -->
    <rect x="214" y="112" width="84" height="168" rx="42" fill="url(#sol)"/>
    <path d="M168 252 a88 88 0 0 0 176 0" fill="none" stroke="#ffb043"
          stroke-width="18" stroke-linecap="round"/>
    <rect x="246" y="332" width="20" height="52" rx="10" fill="#ffb043"/>
    <rect x="192" y="380" width="128" height="20" rx="10" fill="#ffb043"/>
    <!-- Huella de integridad: tres marcas dentro de la cápsula -->
    <rect x="236" y="150" width="40" height="10" rx="5" fill="#1b2330" opacity=".38"/>
    <rect x="236" y="176" width="40" height="10" rx="5" fill="#1b2330" opacity=".38"/>
    <rect x="236" y="202" width="40" height="10" rx="5" fill="#1b2330" opacity=".38"/>

  </g>
</svg>
