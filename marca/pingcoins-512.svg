<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2330"/><stop offset="1" stop-color="#4a2a12"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/><stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#cielo)"/>
  <g id="motivo">

    <!-- Moneda golpeada: el disco y el sonido que sale de él. Las ondas sólo
         salen por un lado, así que el grupo se desplaza para que el centro
         óptico caiga en el del lienzo. -->
    <circle cx="207" cy="256" r="92" fill="url(#sol)"/>
    <circle cx="207" cy="256" r="62" fill="none" stroke="#1b2330"
            stroke-width="11" opacity=".34"/>
    <path d="M319 182 A124 124 0 0 1 319 330" fill="none" stroke="#ffb043"
          stroke-width="16" stroke-linecap="round" opacity=".9"/>
    <path d="M349 148 A166 166 0 0 1 349 364" fill="none" stroke="#ffb043"
          stroke-width="16" stroke-linecap="round" opacity=".5"/>

  </g>
</svg>
